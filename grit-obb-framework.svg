<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
<title id="title">GRIT-OBB framework</title>
<desc id="desc">ResNet-50 and FPN features produce horizontal proposals. Supervised proposal correction provides oriented reference boxes for rotated alignment and geometry-guided regional interaction. Classification and refinement produce oriented detections. Two localization losses supervise proposal correction and final prediction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#355574"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748397"/></marker></defs>
<rect width="1440" height="730" fill="white"/><text x="40" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153e59">GRIT-OBB · Geometry-aligned localization</text>
<g fill="none" stroke="#355574" stroke-width="3" marker-end="url(#arrow)">
<path d="M320 125 H390"/><path d="M670 125 H740"/><path d="M1020 125 H1090"/><path d="M1230 170 V320"/><path d="M1090 365 H1020"/><path d="M740 365 H670"/><path d="M390 365 H320"/><path d="M530 170 V225 H1140 V320"/>
</g>
<text x="560" y="213" font-family="Arial,sans-serif" font-size="20" fill="#355574">FPN features</text>
<g fill="none" stroke="#748397" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash)">
<path d="M1090 145 H1060 V270 H880 V320"/><path d="M1370 125 H1410 V585 H1300"/><path d="M530 410 V540"/>
</g>
<text x="905" y="293" font-family="Arial,sans-serif" font-size="20" fill="#66758a">Box geometry</text>
<g font-family="Arial,sans-serif"><rect x="40" y="80" width="280" height="90" rx="12" fill="#eaf2fb" stroke="#527aa0" stroke-width="2"/><text x="180" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">Medical image</text><text x="180" y="144" text-anchor="middle" font-size="18" fill="#48637a">RGB input</text></g>
<g font-family="Arial,sans-serif"><rect x="390" y="80" width="280" height="90" rx="12" fill="#eaf2fb" stroke="#527aa0" stroke-width="2"/><text x="530" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">ResNet-50 + FPN</text><text x="530" y="144" text-anchor="middle" font-size="18" fill="#48637a">Multi-scale features</text></g>
<g font-family="Arial,sans-serif"><rect x="740" y="80" width="280" height="90" rx="12" fill="#eaf2fb" stroke="#527aa0" stroke-width="2"/><text x="880" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">Horizontal RPN</text><text x="880" y="144" text-anchor="middle" font-size="18" fill="#48637a">Region proposals</text></g>
<g font-family="Arial,sans-serif"><rect x="1090" y="80" width="280" height="90" rx="12" fill="#e5f5ef" stroke="#527aa0" stroke-width="2"/><text x="1230" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">Proposal correction</text><text x="1230" y="144" text-anchor="middle" font-size="18" fill="#48637a">Supervised oriented geometry</text></g>
<g font-family="Arial,sans-serif"><rect x="1090" y="320" width="280" height="90" rx="12" fill="#eaf2fb" stroke="#527aa0" stroke-width="2"/><text x="1230" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">Rotated alignment</text><text x="1230" y="384" text-anchor="middle" font-size="18" fill="#48637a">Position-sensitive sampling</text></g>
<g font-family="Arial,sans-serif"><rect x="740" y="320" width="280" height="90" rx="12" fill="#e5f5ef" stroke="#527aa0" stroke-width="2"/><text x="880" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#173d58">Geometry-guided relation</text><text x="880" y="384" text-anchor="middle" font-size="18" fill="#48637a">Appearance + box geometry</text></g>
<g font-family="Arial,sans-serif"><rect x="390" y="320" width="280" height="90" rx="12" fill="#eaf2fb" stroke="#527aa0" stroke-width="2"/><text x="530" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#173d58">Classification + refinement</text><text x="530" y="384" text-anchor="middle" font-size="18" fill="#48637a">Oriented box prediction</text></g>
<g font-family="Arial,sans-serif"><rect x="40" y="320" width="280" height="90" rx="12" fill="#eaf2fb" stroke="#527aa0" stroke-width="2"/><text x="180" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">Oriented detections</text><text x="180" y="384" text-anchor="middle" font-size="18" fill="#48637a">Class, score, box</text></g>
<g font-family="Arial,sans-serif"><rect x="390" y="540" width="390" height="90" rx="12" fill="#f2f5f9" stroke="#a8b5c4" stroke-width="2"/><text x="585" y="576" text-anchor="middle" font-size="22" font-weight="700" fill="#173d58">Final localization loss</text><text x="585" y="604" text-anchor="middle" font-size="17" fill="#48637a">Equivalent-box regression + rotated IoU</text></g>
<g font-family="Arial,sans-serif"><rect x="910" y="540" width="390" height="90" rx="12" fill="#f2f5f9" stroke="#a8b5c4" stroke-width="2"/><text x="1105" y="576" text-anchor="middle" font-size="19" font-weight="700" fill="#173d58">Proposal localization loss</text><text x="1105" y="604" text-anchor="middle" font-size="17" fill="#48637a">Equivalent-box regression + rotated IoU</text></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#48637a"><text x="40" y="680">Solid arrows: feature / proposal flow. Dashed arrows: geometric conditioning or training supervision.</text><text x="40" y="711">Corrected reference boxes are detached before feature sampling.</text></g>
</svg>
